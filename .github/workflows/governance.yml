name: Governance validation

on:
  pull_request:
  push:
    branches: [main]

# OPTIONAL HOSTED ADAPTER.
# RepoPact CI is local-first. GitHub-hosted validation is opt-in and disabled
# by default. Set repository variable REPOPACT_GITHUB_CI to exactly "true"
# to allow this adapter to allocate a hosted runner.
#
# The workflow deliberately does not define the semantic check list. It installs
# RepoPact and invokes the same repository-defined local profile used by an
# operator workstation.
jobs:
  validate:
    if: ${{ vars.REPOPACT_GITHUB_CI == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install RepoPact development environment
        run: python -m pip install -e ".[dev]"
      - name: Run canonical local CI profile
        run: python -m repopact.verify_cli ci --root .
