name: Governance validation

on:
  pull_request:
  push:
    branches: [main]

# TEMPORARY LOCAL-ONLY MODE (operator directive, 2026-09-01):
# GitHub-hosted execution is intentionally suspended while the account is
# payment-locked. Preserve this workflow as the hosted adapter/reference, but
# do not allocate a hosted runner until the operator explicitly lifts the stop.
jobs:
  validate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: repopact validate
      - run: python -m unittest discover -s tests -v
      - run: python -m repopact.run_conformance
      - run: repopact dashboard
      - run: repopact spec
      - name: Ensure derived artifacts are current
        run: git diff --exit-code -- audits/reports/dashboard.md SPEC.md
      # Frozen-surface backstop (INV-6). The binding gate is human operator
      # approval, which for this repo is PR review; this step surfaces frozen
      # changes for the reviewer rather than blocking the merge mechanically.
      - name: Report frozen-surface changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: repopact check-frozen --base "origin/${{ github.base_ref }}"
