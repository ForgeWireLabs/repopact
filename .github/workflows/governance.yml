name: Governance validation

on:
  pull_request:
  push:
    branches: [main]

# OPTIONAL HOSTED ADAPTER.
# RepoPact CI is local-first. GitHub-hosted validation is opt-in and disabled
# by default. Set repository variable REPOPACT_GITHUB_CI to exactly "true"
# to allow this adapter to allocate a hosted runner.
jobs:
  validate:
    if: ${{ vars.REPOPACT_GITHUB_CI == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: repopact validate
      - run: python -m unittest discover -s tests -v
      - run: python -m repopact.run_conformance
      - run: repopact dashboard
      - run: repopact spec
      - name: Ensure derived artifacts are current
        run: git diff --exit-code -- audits/reports/dashboard.md SPEC.md
      # Frozen-surface backstop (INV-6). The binding gate is human operator
      # approval, which for this repo is PR review; this step surfaces frozen
      # changes for the reviewer rather than blocking the merge mechanically.
      - name: Report frozen-surface changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: repopact check-frozen --base "origin/${{ github.base_ref }}"
