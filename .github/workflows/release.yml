name: Publish to PyPI

# OPTIONAL HOSTED ADAPTER.
# RepoPact CD is local-first. GitHub-hosted build/publish is opt-in and
# disabled by default. Set repository variable REPOPACT_GITHUB_CD to exactly
# "true" to allow this adapter to allocate hosted runners and publish.
#
# When enabled, publication uses PyPI Trusted Publishing (OIDC) with no stored
# API token. Local publication remains a separate supported architecture under
# Decision 0043 / WI046.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ vars.REPOPACT_GITHUB_CD == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: ${{ vars.REPOPACT_GITHUB_CD == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
