name: Publish to PyPI

# OPTIONAL HOSTED ADAPTER.
# RepoPact CD is local-first. GitHub-hosted build/publish is opt-in and
# disabled by default. Set repository variable REPOPACT_GITHUB_CD to exactly
# "true" to allow this adapter to allocate hosted runners and publish.
#
# Release verification and artifact construction use the same local WI046
# contract available on an operator workstation. GitHub OIDC is only the
# optional credential transport for the final upload step.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ vars.REPOPACT_GITHUB_CD == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install RepoPact release environment
        run: python -m pip install -e ".[dev]"
      - name: Verify and build through the canonical local release path
        run: python -m repopact.release_local build --root . --outdir release-out
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            release-out/*.whl
            release-out/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            release-out/release-manifest.json
            release-out/release-build-report.json

  publish:
    if: ${{ vars.REPOPACT_GITHUB_CD == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
