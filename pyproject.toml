[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repopact"
dynamic = ["version"]
description = "A repository-native standard for durable agent work: binding invariants, evidence-gated work items, and drift audits."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema>=4.20"]

[project.urls]
Homepage = "https://github.com/ForgeWireLabs/repopact"
Repository = "https://github.com/ForgeWireLabs/repopact"

[project.scripts]
repopact = "repopact.cli:main"

# One top-level name. Before 3.0.0 this shipped seventeen flat `py-modules`, so
# installing RepoPact claimed `frontmatter`, `doctor`, `new`, `takeover`, and
# thirteen other generic names in the environment's import namespace — colliding
# outright with the `python-frontmatter` distribution. See decision 0029.
[tool.setuptools]
packages = ["repopact"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

# Seed content shipped so `repopact init` works from an installed wheel. These
# reference the canonical top-level files (one source of truth — no duplication).
[tool.setuptools.data-files]
"share/repopact/schemas" = ["schemas/*.json"]
"share/repopact/templates" = ["templates/*"]
