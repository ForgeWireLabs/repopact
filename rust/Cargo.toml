[workspace]
resolver = "2"
members = [
    "crates/repopact-types",
    "crates/repopact-protocol",
    "crates/repopact-schema",
    "crates/repopact-repository",
    "crates/repopact-validation",
    "crates/repopact-graph",
    "crates/repopact-analysis",
    "crates/repopact-mutation",
    "crates/repopact-core",
    "crates/repopact-confinement",
    "crates/repopact-desktop-api",
    "crates/repopact-mobile-acquisition",
    "crates/repopact-mobile-saf",
    "crates/repopact-remote-provider",
    "crates/repopact-provider-github",
    "apps/repopact-cli",
    "apps/repopact-engine",
    "apps/repopact-sandbox",
    "apps/repopact-desktop/src-tauri",
]

[workspace.dependencies]
jsonschema = { version = "0.55.1", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
# WI067 Checkpoint B: the production GitHub REST/device-flow HTTP transport
# (repopact-provider-github). Blocking client (no async-ification of the
# provider seam needed for Checkpoint B); rustls-tls avoids an OpenSSL/
# native-tls cross-compilation dependency for the Android target. Chosen
# over a lower-level client because it gives explicit timeout, redirect
# (disabled here and re-implemented manually per Decision 0061's header
# policy), and streaming-response control out of the box, and is already
# the de facto standard HTTP client in the Tauri ecosystem.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# WI067 Checkpoint B: production OS-protected credential storage
# (repopact-remote-provider::credential_os). Covers Windows Credential
# Manager, macOS/iOS Keychain, and Linux Secret Service/libsecret behind
# one API; Android is not covered by this crate and remains a distinct,
# recorded gate (Decision 0061 / GH-004).
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service"] }
repopact-core = { path = "crates/repopact-core" }
repopact-desktop-api = { path = "crates/repopact-desktop-api" }
repopact-mobile-acquisition = { path = "crates/repopact-mobile-acquisition" }
repopact-mobile-saf = { path = "crates/repopact-mobile-saf" }
repopact-remote-provider = { path = "crates/repopact-remote-provider" }
repopact-provider-github = { path = "crates/repopact-provider-github" }
repopact-analysis = { path = "crates/repopact-analysis" }
repopact-graph = { path = "crates/repopact-graph" }
repopact-mutation = { path = "crates/repopact-mutation" }
repopact-repository = { path = "crates/repopact-repository" }
repopact-schema = { path = "crates/repopact-schema" }
repopact-types = { path = "crates/repopact-types" }
repopact-protocol = { path = "crates/repopact-protocol" }
repopact-validation = { path = "crates/repopact-validation" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
libc = "0.2"
# Deterministic TOML metadata extraction (WI063 metadata/operational-
# topology checkpoint, Decision 0048) -- Cargo.toml/pyproject.toml.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Exact pins per Decision 0045: same-major schema compatibility depends on
# stable, reproducible parser behavior, not a floating grammar version
# that could shift AST shape between builds.
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
