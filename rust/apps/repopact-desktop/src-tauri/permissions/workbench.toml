"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "workbench-commands"
description = "Allow only the typed RepoPact workbench commands."
commands.allow = [
  "select_repository",
  "close_repository",
  "repository_overview",
  "refresh_repository",
  "validate_repository",
  "list_work_items",
  "get_work_item",
  "list_decisions",
  "get_decision",
  "list_evidence",
  "get_evidence",
  "relationship_graph",
  "analyze_work_item",
  "plan_mutation",
  "apply_mutation_plan",
  "discard_mutation_plan",
  "poll_repository_events",
  "mobile_workspace_list",
  "mobile_import_directory",
  "mobile_import_archive",
  "mobile_operation_status",
  "mobile_operation_cancel",
  "mobile_workspace_open",
  "mobile_git_capabilities",
  "mobile_export_workspace_directory",
  "mobile_export_workspace_archive",
  "mobile_workspace_source_status",
  "mobile_workspace_remove"
]
